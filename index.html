<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone de Nicole</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="iphone-container">
    <!-- Barra de estado -->
    <div class="status-bar">
      <span class="time">18:58</span>
      <div class="dynamic-island"></div>
      <div class="icons">
        <span>📶</span>
        <span class="battery">85%</span>
      </div>
    </div>

    <!-- PANTALLA 1: MENSAJES -->
    <div id="view-messages" class="view active">
      <div class="header">
        <h1>Mensajes</h1>
      </div>
      <div class="chat-list">
        <!-- Jake -->
        <div class="chat-item" onclick="openChat('Jake 🖤', 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150', [
          { sender: 'them', text: '¿Dónde estás? Quedamos en que me avisabas cuando llegaras.' },
          { sender: 'them', text: 'Vi que Heeseung te comentó la foto... ¿por qué le diste me gusta?' },
          { sender: 'me', text: 'Jake, tranquilízate, es solo un amigo.' },
          { sender: 'them', text: 'No me importa Nicole, no quiero que te juntes a solas con él.' }
        ])">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="avatar-img" alt="Jake">
          <div class="chat-info">
            <div class="chat-header">
              <span class="name">Jake 🖤</span>
              <span class="date">Ahora</span>
            </div>
            <p class="last-message">No me importa Nicole, no quiero que...</p>
          </div>
        </div>

        <!-- Heeseung -->
        <div class="chat-item" onclick="openChat('Heeseung 🎧', 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150', [
          { sender: 'them', text: 'Hola Nicole, ¿pudiste revisar el audio?' },
          { sender: 'me', text: '¡Sí! Quedó genial. Oye, Jake está súper celoso jajaja.' },
          { sender: 'them', text: 'Uff, otra vez... dile que solo estamos trabajando en la música.' }
        ])">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150" class="avatar-img" alt="Heeseung">
          <div class="chat-info">
            <div class="chat-header">
              <span class="name">Heeseung 🎧</span>
              <span class="date">18:30</span>
            </div>
            <p class="last-message">Uff, otra vez... dile que solo estamos...</p>
          </div>
        </div>

        <!-- Jungwon -->
        <div class="chat-item" onclick="openChat('Jungwon 🐈', 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150', [
          { sender: 'them', text: '¿Sigue Jake molestando por lo de Heeseung?' },
          { sender: 'me', text: 'Sí, está super intenso hoy, no me deja en paz jajaja.' },
          { sender: 'them', text: 'Ay Nicole, ya sabes cómo es de celoso cuando se trata de ti 🤦‍♂️' }
        ])">
          <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150" class="avatar-img" alt="Jungwon">
          <div class="chat-info">
            <div class="chat-header">
              <span class="name">Jungwon 🐈</span>
              <span class="date">12:15</span>
            </div>
            <p class="last-message">Ay Nicole, ya sabes cómo es de celoso cuando...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- PANTALLA 2: CONVERSACIÓN ABIERTA -->
    <div id="view-chat" class="view">
      <div class="chat-navbar">
        <button class="back-btn" onclick="switchView('view-messages')">‹ Mensajes</button>
        <div class="contact-profile">
          <img id="chat-avatar" src="" alt="Avatar">
          <span id="chat-title" class="contact-name"></span>
        </div>
      </div>
      <div class="messages-container" id="messages-container"></div>
      <div class="chat-input-bar">
        <input type="text" id="message-input" placeholder="iMessage" onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">⬆</button>
      </div>
    </div>

    <!-- PANTALLA 3: TELÉFONO / LLAMADAS -->
    <div id="view-phone" class="view">
      <div class="header">
        <h1>Teléfono</h1>
      </div>
      <div class="phone-display">
        <span id="phone-number"></span>
      </div>
      <div class="keypad">
        <div class="key" onclick="pressKey('1')">1</div>
        <div class="key" onclick="pressKey('2')">2</div>
        <div class="key" onclick="pressKey('3')">3</div>
        <div class="key" onclick="pressKey('4')">4</div>
        <div class="key" onclick="pressKey('5')">5</div>
        <div class="key" onclick="pressKey('6')">6</div>
        <div class="key" onclick="pressKey('7')">7</div>
        <div class="key" onclick="pressKey('8')">8</div>
        <div class="key" onclick="pressKey('9')">9</div>
        <div class="key" onclick="pressKey('*')">*</div>
        <div class="key" onclick="pressKey('0')">0</div>
        <div class="key" onclick="pressKey('#')">#</div>
      </div>
      <div class="call-action">
        <button class="call-btn" onclick="makeCall()">📞</button>
      </div>
    </div>

    <!-- PANTALLA DE LLAMADA EN CURSO -->
    <div id="view-calling" class="view call-screen">
      <div class="caller-info">
        <img id="caller-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Caller">
        <h2 id="caller-name">Jake 🖤</h2>
        <p id="call-status">Llamando...</p>
      </div>
      <div class="call-controls">
        <button class="end-call-btn" onclick="endCall()">📵</button>
      </div>
    </div>

    <!-- BARRA INFERIOR DE NAVEGACIÓN -->
    <div class="tab-bar">
      <button class="tab-item" onclick="switchView('view-phone')">
        <span class="tab-icon">📞</span>
        <span class="tab-label">Teléfono</span>
      </button>
      <button class="tab-item active" onclick="switchView('view-messages')">
        <span class="tab-icon">💬</span>
        <span class="tab-label">Mensajes</span>
      </button>
    </div>

    <div class="home-indicator"></div>
  </div>

  <script>
    let currentContactName = '';
    let dialedNumber = '';

    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    function openChat(name, photo, messages) {
      currentContactName = name;
      switchView('view-chat');
      document.getElementById('chat-title').innerText = name;
      document.getElementById('chat-avatar').src = photo;

      const container = document.getElementById('messages-container');
      container.innerHTML = '';
      messages.forEach(msg => appendMessage(msg.text, msg.sender));
    }

    function appendMessage(text, sender) {
      const container = document.getElementById('messages-container');
      const bubble = document.createElement('div');
      bubble.classList.add('message-bubble', sender);
      bubble.innerText = text;
      container.appendChild(bubble);
      container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;
      appendMessage(text, 'me');
      input.value = '';

      setTimeout(() => {
        let reply = "No me cambies de tema Nicole.";
        if (currentContactName.includes('Jake')) {
          reply = "¿Y por qué te tardas tanto en responder? Seguro estás con él 😠";
        } else if (currentContactName.includes('Heeseung')) {
          reply = "Dile a Jake que se relaje, solo somos amigos.";
        } else if (currentContactName.includes('Jungwon')) {
          reply = "Jajaja dile que no sea tan celoso 🐈";
        }
        appendMessage(reply, 'them');
      }, 1000);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function pressKey(num) {
      dialedNumber += num;
      document.getElementById('phone-number').innerText = dialedNumber;
    }

    function makeCall() {
      switchView('view-calling');
      document.getElementById('caller-name').innerText = dialedNumber || 'Jake 🖤';
      document.getElementById('call-status').innerText = 'Llamando...';

      setTimeout(() => {
        document.getElementById('call-status').innerText = '00:01 - ¡Hola Nicole! ¿Por qué llamas?';
      }, 2000);
    }

    function endCall() {
      dialedNumber = '';
      document.getElementById('phone-number').innerText = '';
      switchView('view-phone');
    }
  </script>
</body>
</html>
