<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone de Nicole</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="iphone-container">
    <div class="screen">
      <!-- Barra superior del iPhone -->
      <div class="status-bar">
        <span class="time">18:58</span>
        <div class="dynamic-island"></div>
        <div class="icons">
          <span>📶</span>
          <span>📶</span>
          <span class="battery">85%</span>
        </div>
      </div>

      <!-- Encabezado de la app de Mensajes/Ajustes -->
      <div class="header">
        <h1>Mensajes</h1>
      </div>

      <!-- Lista de Chats con Personajes -->
      <div class="chat-list">
        <div class="chat-item">
          <div class="avatar">👦</div>
          <div class="chat-info">
            <div class="chat-header">
              <span class="name">Jake</span>
              <span class="date">Ayer</span>
            </div>
            <p class="last-message">¿Ya viste la nueva canción? ¡Está increíble!</p>
          </div>
        </div>

        <div class="chat-item">
          <div class="avatar">🎤</div>
          <div class="chat-info">
            <div class="chat-header">
              <span class="name">Heeseung</span>
              <span class="date">18:30</span>
            </div>
            <p class="last-message">Nos vemos en el ensayo más tarde.</p>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
